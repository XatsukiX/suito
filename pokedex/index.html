<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水都地方 ポケモン図鑑ポータル</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }

        .dex-card.selected {
            border-color: #3b82f6;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-4px);
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg shadow-blue-200 shadow-lg">
                    <i data-lucide="waves" class="text-white w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">
                    水都エネルギー研究所 <span class="font-light text-slate-500">| Pokédex Portal</span>
                </h1>
            </div>
            <nav class="hidden md:flex gap-6 text-sm font-medium text-slate-600">
                <a href="#" class="hover:text-blue-600 transition-colors">研究所概要</a>
                <a href="#" class="hover:text-blue-600 transition-colors">エクシード解析</a>
                <a href="#" class="hover:text-blue-600 transition-colors">地図</a>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <!-- Dex Selection Grid -->
        <div id="pokedex-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 mb-16">
            <!-- JavaScriptでここにカードが生成されます -->
        </div>

        <!-- Team Zenith Warning -->
        <div class="bg-slate-900 rounded-3xl p-8 text-white relative overflow-hidden shadow-2xl border border-slate-700">
            <div class="absolute top-0 right-0 p-4 opacity-5">
                <i data-lucide="shield" class="w-40 h-40 text-white"></i>
            </div>
            <div class="relative z-10 flex flex-col md:flex-row items-center gap-8 text-center md:text-left">
                <div class="bg-red-500/20 p-4 rounded-full border border-red-500/50 animate-pulse">
                    <i data-lucide="info" class="w-8 h-8 text-red-400"></i>
                </div>
                <div class="flex-1">
                    <h4 class="text-xl font-bold mb-2 flex items-center justify-center md:justify-start gap-2">
                        <span class="text-red-500">⚠</span> 暴走メガシンカポケモンへの警戒
                    </h4>
                    <p class="text-slate-400 text-sm leading-relaxed max-w-2xl">
                        周囲のメガシンカエネルギー濃度が急上昇しています。
                    </p>
                </div>
                <button class="whitespace-nowrap bg-white text-slate-900 px-6 py-3 rounded-xl font-bold hover:bg-slate-100 transition-colors shadow-lg">
                    Level X
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-10">
        <div class="max-w-6xl mx-auto px-6 text-center">
            <p class="text-xs text-slate-400 font-medium tracking-widest">
                © SUITO ENERGY INSTITUTE / DR. GIRASO ARCHIVES
            </p>
        </div>
    </footer>

    <script>
        // 【図鑑データ】
        // url プロパティに遷移先のURL（ファイル名や外部リンク）を記述してください。
        const pokedexOptions = [
            {
                id: 'regional',
                title: '水都図鑑',
                subtitle: 'Suito Regional Pokédex',
                description: '水都地方の全域に生息する384種類のポケモンを網羅した基本データ。',
                count: 'No.001 - No.384',
                themeColor: 'from-blue-500 to-cyan-400',
                icon: 'book',
                url: './regional/', // ← ここにURLを貼る
                highlights: ['最初の3匹', 'スイトリージョンフォーム']
            },
            {
                id: 'atra',
                title: 'アトラ島図鑑',
                subtitle: 'Atra Island Pokédex',
                description: 'アグルーミ諸島周辺で発見された固有種や化石種を記録。',
                count: 'No.001 - No.080',
                themeColor: 'from-emerald-500 to-teal-400',
                icon: 'tree-palm',
                url: 'atra_island_dex.html', // ← ここにURLを貼る
                status: 'ルネサンス・パス限定',
                highlights: ['ウルトラビースト', '古代種']
            },
            {
                id: 'national',
                title: '全国図鑑',
                subtitle: 'National Pokédex',
                description: '全世界のポケモンの記録データ。1000種類を超える膨大なアーカイブ。',
                count: 'No.001 - No.1025+',
                themeColor: 'from-amber-500 to-orange-400',
                icon: 'globe',
                url: 'national_dex_archive.html', // ← ここにURLを貼る
                status: '殿堂入り後に解放',
                highlights: ['他地方のポケモン', '全進化系統']
            },
            {
                id: 'MEGA',
                title: 'メガシンカ図録',
                subtitle: 'Mega Evolution Gallery',
                description: '水都独自の「暴走メガシンカ」を含む、全メガシンカ個体の解析データ。',
                count: '48 Forms',
                themeColor: 'from-indigo-500 to-purple-400',
                icon: 'dna',
                url: 'mega_evolution_data.html', // ← ここにURLを貼る
                status: 'メガリング入手後',
                highlights: ['メガスイクン', '暴走個体']
            },
            {
                id: 'exceed',
                title: 'エクシードアーカイブ',
                subtitle: 'Exceed Analysis Record',
                description: '絆の武装「エクシード」の記録。専用技エクシードアーツの波形。',
                count: '50+ Records',
                themeColor: 'from-purple-500 to-pink-500',
                icon: 'zap',
                url: 'exceed_records.html', // ← ここにURLを貼る
                status: '解析レベル10',
                highlights: ['エクシードアーツ', '適合率']
            }
        ];

        const grid = document.getElementById('pokedex-grid');
        let selectedId = null;

        function renderCards() {
            grid.innerHTML = pokedexOptions.map(dex => `
                <div 
                    id="card-${dex.id}"
                    onclick="selectCard('${dex.id}')"
                    class="dex-card group relative overflow-hidden rounded-3xl border-2 border-transparent transition-all cursor-pointer bg-white flex flex-col shadow-md hover:shadow-xl hover:-translate-y-1"
                >
                    <div class="absolute top-0 right-0 w-32 h-32 -mr-8 -mt-8 rounded-full blur-3xl opacity-20 bg-gradient-to-br ${dex.themeColor}"></div>
                    
                    <div class="p-8 flex-1 flex flex-col relative z-10">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${dex.themeColor} flex items-center justify-center text-white mb-6 shadow-lg group-hover:scale-110 transition-transform duration-300">
                            <i data-lucide="${dex.icon}" class="w-8 h-8"></i>
                        </div>
                        
                        <div class="mb-6 flex-1">
                            <div class="flex items-center flex-wrap gap-2 mb-1">
                                <h3 class="text-xl font-bold text-slate-900">${dex.title}</h3>
                                ${dex.status ? `<span class="text-[9px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">${dex.status}</span>` : ''}
                            </div>
                            <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-3">${dex.subtitle}</p>
                            <p class="text-sm text-slate-600 leading-relaxed line-clamp-3">${dex.description}</p>
                        </div>

                        <div class="space-y-3">
                            <div class="flex items-center gap-2 text-xs font-bold text-slate-700">
                                <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400"></i>
                                収録数: ${dex.count}
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${dex.highlights.map(h => `<span class="text-[10px] bg-slate-50 text-slate-500 px-2 py-1 rounded-lg border border-slate-100 font-medium">${h}</span>`).join('')}
                            </div>
                        </div>

                        <!-- aタグに変更し、hrefにdex.urlを適用しました -->
                        <a href="${dex.url}" id="btn-${dex.id}" class="mt-8 w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all bg-slate-900 text-white hover:bg-slate-800">
                            <span>データベースを閲覧</span>
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </a>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.selectCard = function(id) {
            if (selectedId) {
                const prevCard = document.getElementById(`card-${selectedId}`);
                const prevBtn = document.getElementById(`btn-${selectedId}`);
                if (prevCard) prevCard.classList.remove('selected');
                if (prevBtn) prevBtn.className = "mt-8 w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all bg-slate-900 text-white hover:bg-slate-800";
            }

            selectedId = id;
            const card = document.getElementById(`card-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            const dex = pokedexOptions.find(d => d.id === id);

            if (card) card.classList.add('selected');
            if (btn && dex) {
                btn.className = `mt-8 w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all bg-gradient-to-r ${dex.themeColor} text-white shadow-lg`;
            }
        };

        renderCards();
    </script>
</body>
</html>
