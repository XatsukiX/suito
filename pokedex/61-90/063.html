<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イーブイ</title>
    <style>
        /* オフライン対応: システムフォントを使用 */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #1a1a1a;
            color: #f3f4f6;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        @media (min-width: 768px) {
            body { padding: 2rem; }
        }

        /* レイアウト */
        header {
            width: 100%;
            max-width: 56rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-dot {
            width: 2.5rem;
            height: 2.5rem;
            background-color: #e11d48;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 0 10px rgba(225, 29, 72, 0.4);
        }

        .pokedex-title {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            margin: 0;
        }

        .database-ver {
            font-family: monospace;
            font-size: 0.875rem;
            opacity: 0.5;
            letter-spacing: 0.1em;
        }

        /* メインフレーム */
        main {
            width: 100%;
            max-width: 56rem;
        }

        .pokedex-frame {
            display: flex;
            flex-direction: column;
            border-left: 8px solid #e11d48;
            background: linear-gradient(135deg, #262626 0%, #171717 100%);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #374151;
        }

        @media (min-width: 768px) {
            .pokedex-frame { flex-direction: row; }
        }

        /* 左側: ビジュアル */
        .visual-side {
            width: 100%;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(23, 23, 23, 0.5);
            border-bottom: 1px solid #374151;
        }

        @media (min-width: 768px) {
            .visual-side {
                width: 50%;
                border-bottom: none;
                border-right: 1px solid #374151;
            }
        }

        .image-container {
            position: relative;
            width: 16rem;
            height: 16rem;
            background-color: #262626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            border: 4px solid #374151;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .image-container img {
            max-width: 90%;
            height: auto;
        }

        /* タイプタグ */
        .type-container { display: flex; gap: 0.5rem; }
        .type-tag {
            padding: 0.25rem 1rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .type-normal { background-color: #A8A77A; }
        .type-fire { background-color: #EE8130; }
        .type-water { background-color: #6390F0; }
        .type-electric { background-color: #F7D02C; }
        .type-grass { background-color: #7AC74C; }
        .type-ice { background-color: #96D9D6; color: #1a1a1a; }
        .type-fighting { background-color: #C22E28; }
        .type-poison { background-color: #A33EA1; }
        .type-ground { background-color: #E2BF65; }
        .type-flying { background-color: #A98FF3; }
        .type-psychic { background-color: #F95587; }
        .type-bug { background-color: #A6B91A; }
        .type-rock { background-color: #B6A136; }
        .type-ghost { background-color: #735797; }
        .type-dragon { background-color: #6F35FC; }
        .type-dark { background-color: #705746; }
        .type-steel { background-color: #B7B7CE; color: #1a1a1a; }
        .type-fairy { background-color: #D685AD; }

        /* 右側: データ */
        .data-side {
            width: 100%;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @media (min-width: 768px) {
            .data-side { width: 50%; }
        }

        .name-row {
            display: flex;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .name-jp { font-size: 2.25rem; font-weight: 900; margin: 0; }
        .name-en { font-size: 1.25rem; font-family: monospace; color: #ef4444; }
        .spec-text { font-size: 0.875rem; color: #9ca3af; margin-bottom: 1.5rem; font-weight: 500; line-height: 1.6; }

        .section-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #374151;
            padding-bottom: 0.25rem;
        }

        .entry-text { font-size: 1.125rem; line-height: 1.625; color: #f3f4f6; font-weight: 500; margin: 0 0 1.5rem 0; }

        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .info-list { list-style: none; padding: 0; margin: 0; font-size: 0.875rem; font-weight: bold; }
        
        .weakness-tag {
            background-color: rgba(127, 29, 29, 0.4);
            color: #f87171;
            border: 1px solid #7f1d1d;
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 10px;
        }

        /* 下部アクション */
        .action-area {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cry-button {
            background-color: #e11d48;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: bold;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cry-button:hover { background-color: #f43f5e; }
        .cry-button:active { transform: scale(0.95); }

        .alert-box { font-size: 10px; color: #4b5563; text-align: right; line-height: 1.2; }

        .nav-footer {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.75rem;
            color: #6b7280;
            width: 100%;
        }

        .nav-link { cursor: pointer; transition: color 0.2s; }
        .nav-link:hover { color: #ef4444; }

        /* トースト通知 */
        #toast {
            position: fixed;
            bottom: 2rem;
            background-color: #1f2937;
            border: 1px solid #374151;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            font-size: 0.875rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo">
            <div class="status-dot"></div>
            <h1 class="pokedex-title">Pokédex</h1>
        </div>
        <div class="database-ver">Suito DATABASE v1.0</div>
    </header>

    <main>
        <div class="pokedex-frame">
            <!-- Left Side: Visuals -->
            <div class="visual-side">
                <div class="image-container">
                    <!-- オンライン時は画像が表示されます。オフライン時は代替テキストが出ます -->
                    <img src="https://zukan.pokemon.co.jp/zukan-api/up/images/index/326507f5595907c72d74ac8ea686a6ce.png" alt="ポケモンの画像">
                </div>
                
                <div class="type-container">
                    <span class="type-tag type-normal">ノーマル</span>
                </div>
            </div>

            <!-- Right Side: Data -->
            <div class="data-side">
                <div>
                    <div class="name-row">
                        <h2 class="name-jp">イーブイ</h2>
                        <span class="name-en">Eevee</span>
                    </div>
                    <div class="spec-text">しんかポケモン <br> 高さ: 0.3m <br> 重さ: 6.5kg</div>
                    
                    <div>
                        <section>
                            <h3 class="section-title">図鑑解説</h3>
                            <p class="entry-text">
                                仲間と 群れて 身を 守る 習性を 持つが、 ニューラの 前では 無意味。 狡猾な 連携によって 一匹ずつ 確実に 追い詰められ、 結局は すべて 捕食されてしまう                  
                            </p>
                        </section>

                        <div class="grid-container">
                            <div>
                                <h3 class="section-title">とくせい</h3>
                                <ul class="info-list">
                                    <li>にげあし</li>
                                    <li>てきおうりょく</li>
                                </ul>
                            </div>
                            <div>
                                <h3 class="section-title">弱点</h3>
                                <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                                    <span class="type-tag type-fighting">かくとう(4x)</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="nav-footer">
            <div class="nav-link"><a href="./82.html">← No.82 ペルシアン</a></div>
            <div class="nav-link"><a href="./84.html">No.84 シャワーズ →</a></div>
        </div>
    </main>

    <script>
        window.onload = () => {
            const cryBtn = document.getElementById('cryBtn');
            const toast = document.getElementById('toast');

            if (cryBtn && toast) {
                cryBtn.addEventListener('click', () => {
                    toast.style.opacity = '1';
                    setTimeout(() => {
                        toast.style.opacity = '0';
                    }, 2000);
                });
            }
        };
    </script>
</body>
</html>
